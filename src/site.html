<style>
  :root{--bg:#0a0a0f;--fg:#f4f4f7;--accent:#7c5cff;--font:'Space Grotesk',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
  h1,h2,.brand{font-family:var(--font);letter-spacing:-.02em;line-height:1.02}
  a{color:inherit}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
  .brand{font-weight:800;font-size:20px}
  .hero{position:relative;min-height:86vh;display:flex;align-items:center;padding:80px 0;overflow:hidden}
  .hero .bg{position:absolute;inset:0;z-index:0}
  .hero .bg img{width:100%;height:100%;object-fit:cover;opacity:.42;filter:saturate(1.1)}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 20% 0%,transparent,var(--bg) 72%);z-index:1}
  .hero .inner{position:relative;z-index:2;max-width:820px}
  .hero h1{font-size:clamp(42px,8vw,104px);font-weight:800}
  .hero p{margin-top:22px;font-size:clamp(17px,2.2vw,22px);opacity:.82;max-width:60ch}
  .cta{display:inline-block;margin-top:34px;padding:15px 30px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none;transition:transform .2s}
  .cta:hover{transform:translateY(-2px)}
  .tag{display:inline-block;font-family:var(--font);font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:20px}
  section{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:96px 0}
  section.alt{direction:rtl}section.alt>*{direction:ltr}
  @media(max-width:820px){section{grid-template-columns:1fr;gap:28px;padding:64px 0}}
  h2{font-size:clamp(28px,4.4vw,52px);margin-bottom:18px}
  section p{opacity:.8;margin-bottom:12px;max-width:56ch}
  .media img{width:100%;border-radius:20px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}
  footer{padding:80px 0 60px;text-align:center;opacity:.6;border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent);margin-top:40px}
</style>

<nav class="wrap"><span class="brand">```json</span><a class="cta" style="margin:0;padding:10px 20px" href="#start">Get started</a></nav>

  &quot;hero&quot;: {
    &quot;headline&quot;: &quot;Domine Seu Nicho com Anúncios</p>
    
  </div>
</header>

<footer>```json</footer>
<script>
  const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.16});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
